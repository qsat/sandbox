# ~/.tmux.conf に追記する（prefix a / prefix A は現行の tmux.conf で空いている）
# run-shell / display-popup は呼び出し元を知らないので、#{client_name} / #{pane_id} を引数で渡す

# エージェント一覧（blocked が先頭）。Enter で移動、n で新規、R で再開
bind a display-popup -E -w 90% -h 80% "ws ui --client '#{client_name}'"

# 今の worktree のエージェントを agents ウィンドウに全部並べる（-a で子エージェントも）
bind A run-shell "ws panes --pane '#{pane_id}'"
