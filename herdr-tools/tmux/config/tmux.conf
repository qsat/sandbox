# ~/.tmux.conf に追記する（prefix a / prefix A は現行の tmux.conf で空いている）
# run-shell は呼び出し元のペインを知らないので #{pane_id} を引数で渡す。display-popup はコマンドの #{...} を展開しないので渡さない（ws ui は popup の中の TMUX から呼び出し元のクライアントを取る）

# エージェント一覧（blocked が先頭）。Enter で移動、n で新規、R で再開、s で停止、x で tmux セッションを閉じる。枠線なしで開く
bind a display-popup -E -B -w 80% -h 90% "ws ui"

# 今の worktree のエージェントを agents ウィンドウに全部並べる。会話ペインが別のウィンドウ・セッションにあれば、開き直さずそのペインを集める（ws panes に -a を足すと子エージェントも）
bind A run-shell "ws panes --pane '#{pane_id}'"

# 会話中のペイン（@ws_agent がある）から抜ける。hc attach の切り離しキー Ctrl+\ をペインへ直接送るので、vim-tmux-navigator の C-\ と競合しない
bind 'C-\' if-shell -F '#{@ws_agent}' "send-keys 'C-\\'" "display-message '会話中のペインではありません'"

# 注意が要るエージェントの会話ペインへ移る。blocked（入力待ち）→ done（応答を終えた）→ idle の順の列を、押すたびに次へ巡回する（同じ status の中は status になった時刻が新しい順。working は入れない）。候補が無ければステータス行にメッセージを出す
bind b run-shell "ws next --client '#{client_name}'"

# 同じ列を後ろへ巡回する（1 つ前のエージェントへ移る）
bind B run-shell "ws next --prev --client '#{client_name}'"

# prefix 無しの割り当て。Ghostty の ctrl+alt+shift+j / k が M-B / M-W として届き（Ghostty 側は keybind = ctrl+alt+shift+j=text:\x1bB と ctrl+alt+shift+k=text:\x1bW）、prefix b / prefix B と同じ動きになる
bind -n M-B run-shell "ws next --client '#{client_name}'"
bind -n M-W run-shell "ws next --prev --client '#{client_name}'"

# 今いるペイン・ウィンドウ・セッションが変わったら、決まったフォルダーのファイルに触れる。Herdr app の mod（agent-board）がそのフォルダーを見張り、2 秒ごとの読み直しを待たずに一覧を読み直す（今いるペインの薄い黄色がすぐ追従する）
# [50] は set-hook の配列の番号。ほかの hook（番号なし、または別の番号）を上書きしない。処理は ws を起動せず mkdir と touch だけにして軽くする
set-hook -g window-pane-changed[50] 'run-shell -b "mkdir -p \"$HOME/.cache/herdr-tools/tmux-focus\" && touch \"$HOME/.cache/herdr-tools/tmux-focus/event\""'
set-hook -g session-window-changed[50] 'run-shell -b "mkdir -p \"$HOME/.cache/herdr-tools/tmux-focus\" && touch \"$HOME/.cache/herdr-tools/tmux-focus/event\""'
set-hook -g client-session-changed[50] 'run-shell -b "mkdir -p \"$HOME/.cache/herdr-tools/tmux-focus\" && touch \"$HOME/.cache/herdr-tools/tmux-focus/event\""'

# Ghostty のウインドウのフォーカスの出入りを tmux に届ける。tmux はフォーカスの出入りでもクライアントの client_activity を更新するので、
# Herdr app から移るとき（--from-app）に選ぶ「最後に使われたクライアント」が、最後に選んだ Ghostty のウインドウになる。macOS が Ghostty を前に出すと最後に選んだウインドウが前に来るので、移る先と前に出るウインドウがそろう
# off のままだと client_activity はキー入力でしか更新されず、クリックで選んだだけのウインドウは選ばれない。変えたあとは、開いている Ghostty のウインドウの tmux をつなぎ直す（tmux はつなぎ直すまで端末にフォーカスの通知を頼まない）
set -g focus-events on

# hunk の中で e を押したときに開くエディター。hunk は $EDITOR だけを見る（$VISUAL や hunk の設定ファイルは見ない）。nvim なら `nvim +<行> <ファイル>` で、hunk を止めて同じペインで開く
# ws hunk は hunk を tmux のウィンドウで起動するので、シェルの rc ではなく tmux のグローバルな環境に入れる（tmux サーバーを skhd や Herdr app から起動していても効く）
set-environment -g EDITOR nvim
