# ~/.tmux.conf に追記する（prefix a / prefix A は現行の tmux.conf で空いている）
# run-shell は呼び出し元のペインを知らないので #{pane_id} を引数で渡す。display-popup はコマンドの #{...} を展開しないので渡さない（ws ui は popup の中の TMUX から呼び出し元のクライアントを取る）

# エージェント一覧（blocked が先頭）。Enter で移動、n で新規、R で再開、s で停止、x で tmux セッションを閉じる。枠線なしで開く
bind a display-popup -E -B -w 80% -h 90% "ws ui"

# 今の worktree のエージェントを agents ウィンドウに全部並べる（-a で子エージェントも）
bind A run-shell "ws panes --pane '#{pane_id}'"

# 会話中のペイン（@ws_agent がある）から抜ける。hc attach の切り離しキー Ctrl+\ をペインへ直接送るので、vim-tmux-navigator の C-\ と競合しない
bind 'C-\' if-shell -F '#{@ws_agent}' "send-keys 'C-\\'" "display-message '会話中のペインではありません'"

# 入力待ち（blocked）のエージェントの会話ペインへ移る。押すたびに次の入力待ちへ巡回する。候補が無ければステータス行にメッセージを出す
bind b run-shell "ws next blocked --pane '#{pane_id}' --client '#{client_name}'"

# 作業中（working）のエージェントを同じ要領で巡回する
bind B run-shell "ws next working --pane '#{pane_id}' --client '#{client_name}'"

# prefix 無しの割り当て。Ghostty の alt+b / ctrl+alt+b が M-B / M-W として届き（Ghostty 側は keybind = alt+b=text:\x1bB と ctrl+alt+b=text:\x1bW）、prefix b / prefix B と同じ動きになる
bind -n M-B run-shell "ws next blocked --pane '#{pane_id}' --client '#{client_name}'"
bind -n M-W run-shell "ws next working --pane '#{pane_id}' --client '#{client_name}'"
