<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>エラー</title>
  <style>
    body { font-family: sans-serif; max-width: 28rem; margin: 3rem auto; padding: 0 1rem; }
  </style>
</head>
<body>
  <h1>エラー</h1>
  <!-- 詳細 (例外メッセージやスタックトレース) は出さない。status と error (HTTP の理由句) だけ -->
  <p>リクエストを処理できませんでした。(<span id="error-status" th:text="${status}">400</span>
    <span th:text="${error}">Bad Request</span>)</p>
  <p>リクエストの内容 (登録されていない redirect_uri など) を確認してください。</p>
</body>
</html>
