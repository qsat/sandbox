<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>API 呼び出し</title>
  <style>
    body { font-family: sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
    pre { background: #f4f4f4; padding: .5rem; overflow-x: auto; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <h1>リソースサーバーの呼び出し結果</h1>
  <p class="error" id="error" th:if="${error}" th:text="${error}">error</p>

  <div th:if="${me}">
    <h2>GET /api/me</h2>
    <pre id="me" th:text="${me}">{}</pre>
    <h2>GET /api/notes</h2>
    <pre id="notes" th:text="${notes}">{}</pre>
  </div>

  <h2>使ったアクセストークン</h2>
  <ul th:if="${tokenFingerprint}">
    <li>末尾 8 文字: <code id="token-fingerprint" th:text="${tokenFingerprint}">xxxxxxxx</code></li>
    <li>発行: <span id="token-issued-at" th:text="${tokenIssuedAt}"></span></li>
    <li>期限: <span id="token-expires-at" th:text="${tokenExpiresAt}"></span></li>
    <li>リフレッシュトークン: <span th:text="${hasRefreshToken} ? 'あり' : 'なし'"></span></li>
  </ul>
  <p><a href="/">戻る</a></p>
</body>
</html>
