server:
  port: 9000
  servlet:
    session:
      cookie:
        # Cookie はホスト名で区別され、ポートは区別されない。クライアントなど他のアプリと
        # セッション Cookie 名 (既定は JSESSIONID) が衝突すると、お互いのセッションを上書きしてログインが壊れる。
        # アプリごとに名前を変える。
        name: IDP_SESSION

spring:
  datasource:
    # ファイルモードの H2。target/ 配下に作るので、アプリを止めて再起動してもデータが残る。
    # (mvn clean するとファイルごと消える。コミットされる場所には作らない)
    url: jdbc:h2:file:./target/idp-db
    username: sa
    password: ""
  flyway:
    enabled: true

idp:
  jwk:
    # 署名鍵のファイル (JwkConfig)。無ければ初回起動時に生成する。コミットしないこと
    key-file: ./keys/idp-signing-key.pem
  token:
    # アクセストークンの寿命。動作確認で期限切れを早く見たいときは PT20S などにする (DB が空のとき有効)
    access-token-ttl: PT15M
  cors:
    # SPA のオリジン (CorsConfig)
    allowed-origins: http://127.0.0.1:5173

logging:
  level:
    org.springframework.security: INFO
