<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SPA クライアント</title>
    <style>
      body { font-family: sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
      button { padding: .5rem 1rem; font-size: 1rem; margin: 0 .5rem .5rem 0; }
      pre { background: #f4f4f4; padding: .5rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>SPA クライアント</h1>
    <p id="status">読み込み中…</p>
    <div>
      <button id="login">IdP でログイン</button>
      <button id="userinfo" disabled>UserInfo を呼ぶ</button>
      <button id="api-me" disabled>GET /api/me</button>
      <button id="api-notes" disabled>GET /api/notes</button>
      <button id="logout" disabled>ログアウト (このアプリだけ)</button>
    </div>
    <h2>ID トークンのクレーム</h2>
    <pre id="id-token-claims">-</pre>
    <h2>アクセストークン</h2>
    <pre id="access-token-info">-</pre>
    <h2>結果</h2>
    <pre id="result">-</pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
