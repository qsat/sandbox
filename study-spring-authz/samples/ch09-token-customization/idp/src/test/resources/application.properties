# テストはインメモリ H2。DB_CLOSE_DELAY=-1 で、最後の接続が閉じても JVM が生きている間は DB を残す。
# (同じ URL を指す別のアプリケーションコンテキスト = 「再起動後のアプリ」を作れるようにするため)
spring.datasource.url=jdbc:h2:mem:ch08-test;DB_CLOSE_DELAY=-1
# テストの署名鍵は target/ 配下に作る (mvn clean で消える。リポジトリの keys/ を汚さない)
idp.jwk.key-file=target/test-keys/test-signing-key.pem
