models:
  - name: stg_shop__customers
    description: 会員（1行 = 1会員）。メールは小文字・前後空白除去済み
    columns:
      - name: customer_id
        description: 会員ID（主キー）
        data_tests: [unique, not_null]
      - name: email
        data_tests: [unique, not_null]
      - name: prefecture
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('prefecture_regions')
                field: prefecture

  - name: stg_shop__products
    description: 商品（1行 = 1商品）。焙煎度を読みやすい値に変換済み
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: roast_level
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["light", "medium_light", "medium", "medium_dark", "dark"]
      - name: price_jpy
        data_tests:
          - not_null
          - positive_value

  - name: stg_shop__orders
    description: 注文ヘッダ（1行 = 1注文）。ステータスは小文字に正規化済み
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_shop__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["placed", "shipped", "completed", "returned", "cancelled"]

  - name: stg_shop__order_items
    description: 注文明細（1行 = 1注文明細）
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_shop__orders')
                field: order_id
      - name: quantity
        data_tests: [positive_value]

  - name: stg_shop__payments
    description: 決済（1行 = 1決済試行）。失敗した決済も含む
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: "{{ payment_methods() }}"
      - name: payment_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["success", "failed"]
